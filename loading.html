<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحميل... — YAS Help Desk</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a237e 50%, #0d47a1 100%);
      min-height: 100vh;
      overflow: hidden;
      color: white;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a0e27 0%, #1a237e 50%, #0d47a1 100%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease, transform 1s ease;
    }

    .loading-overlay.fade-out {
      opacity: 0;
      transform: scale(1.1);
      pointer-events: none;
    }

    .speech-bubble {
      position: absolute;
      bottom: 25%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      color: #0a0e27;
      padding: 25px 35px;
      border-radius: 25px;
      font-size: 1.4rem;
      font-weight: 700;
      max-width: 450px;
      text-align: center;
      box-shadow: 
        0 15px 50px rgba(26, 86, 219, 0.3),
        0 0 0 3px rgba(255, 255, 255, 0.2);
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      z-index: 10;
    }

    .speech-bubble.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      border: 18px solid transparent;
      border-top-color: rgba(255, 255, 255, 0.95);
    }

    .continue-btn {
      position: absolute;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
      padding: 18px 60px;
      font-size: 1.3rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #1a56db 0%, #0d47a1 100%);
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      box-shadow: 
        0 15px 40px rgba(26, 86, 219, 0.4),
        0 5px 20px rgba(0, 0, 0, 0.3),
        inset 0 2px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateX(-50%) translateY(30px);
      z-index: 10;
    }

    .continue-btn.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .continue-btn:hover {
      transform: translateX(-50%) translateY(-5px) scale(1.05);
      box-shadow: 
        0 20px 50px rgba(26, 86, 219, 0.5),
        0 10px 30px rgba(0, 0, 0, 0.4),
        inset 0 2px 0 rgba(255, 255, 255, 0.3);
    }

    .continue-btn:active {
      transform: translateX(-50%) translateY(0) scale(0.98);
    }

    .skip-btn {
      position: absolute;
      top: 30px;
      right: 30px;
      padding: 10px 25px;
      font-size: 0.9rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .skip-btn:hover {
      color: white;
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .loading-text {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.5);
      z-index: 10;
    }

    .audio-controls {
      position: absolute;
      top: 30px;
      left: 30px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .audio-btn {
      padding: 10px 15px;
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: all 0.3s ease;
    }

    .audio-btn:hover {
      color: white;
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .audio-btn.active {
      background: rgba(26, 86, 219, 0.3);
      border-color: rgba(26, 86, 219, 0.5);
      color: white;
    }

    @media (max-width: 768px) {
      .speech-bubble {
        font-size: 1.1rem;
        padding: 20px 25px;
        max-width: 320px;
      }

      .continue-btn {
        padding: 15px 40px;
        font-size: 1.1rem;
      }

      .skip-btn {
        top: 20px;
        right: 20px;
        padding: 8px 20px;
        font-size: 0.8rem;
      }

      .audio-controls {
        top: 20px;
        left: 20px;
      }

      .audio-btn {
        padding: 8px 12px;
        font-size: 0.75rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-overlay {
        transition: none;
      }

      .continue-btn:hover {
        transform: translateX(-50%) translateY(0) scale(1);
      }

      .speech-bubble {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div class="loading-overlay" id="loading-overlay">
    <div class="audio-controls">
      <button class="audio-btn" id="mute-btn">🔊 صوت</button>
      <button class="audio-btn" id="replay-btn">🔄 إعادة</button>
    </div>
    <div class="speech-bubble" id="speech-bubble"></div>
    <button class="continue-btn" id="continue-btn">متابعة</button>
    <button class="skip-btn" id="skip-btn">تخطي</button>
    <div class="loading-text" id="loading-text">جاري تحميل المجسم...</div>
  </div>

  <script>
    // Check if already loaded
    if (sessionStorage.getItem('loadingShown')) {
      window.location.href = 'index.html';
    }

    // Set loading shown
    sessionStorage.setItem('loadingShown', 'true');

    // Three.js Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0x1a56db, 1);
    directionalLight.position.set(5, 5, 5);
    scene.add(directionalLight);

    const pointLight = new THREE.PointLight(0x3b82f6, 1, 100);
    pointLight.position.set(0, 5, 0);
    scene.add(pointLight);

    const rimLight = new THREE.DirectionalLight(0x60a5fa, 0.5);
    rimLight.position.set(-5, 0, -5);
    scene.add(rimLight);

    // Robot Group
    const robot = new THREE.Group();

    // Materials
    const bodyMaterial = new THREE.MeshStandardMaterial({ 
      color: 0xffffff,
      metalness: 0.3,
      roughness: 0.4
    });

    const accentMaterial = new THREE.MeshStandardMaterial({ 
      color: 0x1a56db,
      metalness: 0.5,
      roughness: 0.3
    });

    const glowMaterial = new THREE.MeshStandardMaterial({ 
      color: 0x3b82f6,
      emissive: 0x3b82f6,
      emissiveIntensity: 0.5,
      metalness: 0.8,
      roughness: 0.2
    });

    // Head
    const headGeometry = new THREE.SphereGeometry(1.2, 32, 32);
    const head = new THREE.Mesh(headGeometry, bodyMaterial);
    head.position.y = 2.5;
    robot.add(head);

    // Eyes
    const eyeGeometry = new THREE.SphereGeometry(0.25, 16, 16);
    const leftEye = new THREE.Mesh(eyeGeometry, accentMaterial);
    leftEye.position.set(-0.4, 2.6, 0.9);
    robot.add(leftEye);

    const rightEye = new THREE.Mesh(eyeGeometry, accentMaterial);
    rightEye.position.set(0.4, 2.6, 0.9);
    robot.add(rightEye);

    // Eye glow
    const eyeGlowGeometry = new THREE.SphereGeometry(0.3, 16, 16);
    const leftEyeGlow = new THREE.Mesh(eyeGlowGeometry, glowMaterial);
    leftEyeGlow.position.set(-0.4, 2.6, 0.85);
    leftEyeGlow.scale.set(1.2, 1.2, 0.5);
    robot.add(leftEyeGlow);

    const rightEyeGlow = new THREE.Mesh(eyeGlowGeometry, glowMaterial);
    rightEyeGlow.position.set(0.4, 2.6, 0.85);
    rightEyeGlow.scale.set(1.2, 1.2, 0.5);
    robot.add(rightEyeGlow);

    // Body
    const bodyGeometry = new THREE.CylinderGeometry(1, 1.2, 2, 32);
    const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
    body.position.y = 0.5;
    robot.add(body);

    // Chest plate
    const chestGeometry = new THREE.BoxGeometry(1.2, 0.8, 0.3);
    const chest = new THREE.Mesh(chestGeometry, accentMaterial);
    chest.position.set(0, 0.8, 0.8);
    robot.add(chest);

    // Arms
    const armGeometry = new THREE.CylinderGeometry(0.2, 0.25, 1.5, 16);
    const leftArm = new THREE.Mesh(armGeometry, bodyMaterial);
    leftArm.position.set(-1.5, 0.5, 0);
    leftArm.rotation.z = 0.3;
    robot.add(leftArm);

    const rightArm = new THREE.Mesh(armGeometry, bodyMaterial);
    rightArm.position.set(1.5, 0.5, 0);
    rightArm.rotation.z = -0.3;
    robot.add(rightArm);

    // Hands
    const handGeometry = new THREE.SphereGeometry(0.3, 16, 16);
    const leftHand = new THREE.Mesh(handGeometry, bodyMaterial);
    leftHand.position.set(-1.8, -0.4, 0);
    robot.add(leftHand);

    const rightHand = new THREE.Mesh(handGeometry, bodyMaterial);
    rightHand.position.set(1.8, -0.4, 0);
    robot.add(rightHand);

    // Antenna
    const antennaGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.8, 8);
    const antenna = new THREE.Mesh(antennaGeometry, accentMaterial);
    antenna.position.set(0, 3.7, 0);
    robot.add(antenna);

    const antennaTipGeometry = new THREE.SphereGeometry(0.15, 16, 16);
    const antennaTip = new THREE.Mesh(antennaTipGeometry, glowMaterial);
    antennaTip.position.set(0, 4.1, 0);
    robot.add(antennaTip);

    // Add robot to scene
    scene.add(robot);

    // Camera position
    camera.position.set(0, 1.5, 6);
    camera.lookAt(0, 1.5, 0);

    // Particles - lighter
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 200;
    const posArray = new Float32Array(particlesCount * 3);

    for (let i = 0; i < particlesCount * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 15;
    }

    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.03,
      color: 0x3b82f6,
      transparent: true,
      opacity: 0.4
    });
    const particles = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particles);

    // Animation variables
    let mouseX = 0;
    let mouseY = 0;
    let targetRotationX = 0;
    let targetRotationY = 0;
    let isRobotLoaded = false;
    let isTalking = false;

    // Mouse movement
    document.addEventListener('mousemove', (event) => {
      mouseX = (event.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
    });

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      // Robot floating
      robot.position.y = Math.sin(Date.now() * 0.001) * 0.1;

      // Robot rotation based on mouse
      targetRotationY = mouseX * 0.3;
      targetRotationX = mouseY * 0.2;
      robot.rotation.y += (targetRotationY - robot.rotation.y) * 0.05;
      robot.rotation.x += (targetRotationX - robot.rotation.x) * 0.05;

      // Particles animation - very subtle
      particles.rotation.y += 0.0002;
      particles.rotation.x += 0.0001;

      // Eye glow pulsing
      const glowIntensity = 0.3 + Math.sin(Date.now() * 0.003) * 0.2;
      leftEyeGlow.material.emissiveIntensity = glowIntensity;
      rightEyeGlow.material.emissiveIntensity = glowIntensity;

      // Antenna tip pulsing
      antennaTip.material.emissiveIntensity = 0.5 + Math.sin(Date.now() * 0.005) * 0.3;

      // Talking animation
      if (isTalking) {
        chest.scale.y = 1 + Math.sin(Date.now() * 0.025) * 0.08;
        head.rotation.y = Math.sin(Date.now() * 0.01) * 0.05;
      } else {
        chest.scale.y = 1;
        head.rotation.y = 0;
      }

      renderer.render(scene, camera);
    }

    animate();

    // Resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Mark robot as loaded after animation starts
    setTimeout(() => {
      isRobotLoaded = true;
      const loadingText = document.getElementById('loading-text');
      loadingText.textContent = 'جاري التحميل...';
    }, 2000);

    // Speech Synthesis
    const synth = window.speechSynthesis;
    let voices = [];
    let isMuted = false;
    let currentMessageIndex = 0;

    const messages = [
      'مرحباً أيها العميل المميز!',
      'هل أنت مستعد؟ رحلتك معنا تبدأ الآن، وأنا هنا لأرافقك في كل خطوة!',
      'للتحدث معي، انقر على متابعة.'
    ];

    function loadVoices() {
      voices = synth.getVoices();
      console.log('Available voices:', voices.map(v => v.name + ' (' + v.lang + ')'));
    }

    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    function getBestMaleVoice() {
      const arabicVoices = voices.filter(voice => voice.lang.includes('ar'));
      
      // Priority: Male voices first
      const maleKeywords = ['male', 'naayf', 'mohamed', 'hany', 'maged', 'ahmed', 'karim', 'omar'];
      
      for (const keyword of maleKeywords) {
        const found = arabicVoices.find(voice => 
          voice.name.toLowerCase().includes(keyword)
        );
        if (found) {
          console.log('Selected male voice:', found.name);
          return found;
        }
      }

      // Fallback to Microsoft voices (usually high quality)
      const microsoftVoices = arabicVoices.filter(voice => 
        voice.name.toLowerCase().includes('microsoft')
      );
      if (microsoftVoices.length > 0) {
        console.log('Selected Microsoft voice:', microsoftVoices[0].name);
        return microsoftVoices[0];
      }

      // Fallback to any Arabic voice
      if (arabicVoices.length > 0) {
        console.log('Selected fallback voice:', arabicVoices[0].name);
        return arabicVoices[0];
      }

      return null;
    }

    function speak(text, callback) {
      if (isMuted) {
        if (callback) callback();
        return;
      }

      if (synth.speaking) {
        synth.cancel();
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ar-SA';
      utterance.rate = 0.9;
      utterance.pitch = 0.75;
      utterance.volume = 1;

      const selectedVoice = getBestMaleVoice();
      if (selectedVoice) {
        utterance.voice = selectedVoice;
      }

      utterance.onstart = () => {
        isTalking = true;
      };

      utterance.onend = () => {
        isTalking = false;
        if (callback) callback();
      };

      utterance.onerror = () => {
        isTalking = false;
        if (callback) callback();
      };

      synth.speak(utterance);
    }

    // Message display
    const speechBubble = document.getElementById('speech-bubble');
    const continueBtn = document.getElementById('continue-btn');
    const skipBtn = document.getElementById('skip-btn');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    const muteBtn = document.getElementById('mute-btn');
    const replayBtn = document.getElementById('replay-btn');

    function typeText(element, text, callback) {
      let index = 0;
      element.textContent = '';
      element.classList.add('visible');
      
      function type() {
        if (index < text.length) {
          element.textContent += text.charAt(index);
          index++;
          setTimeout(type, 45);
        } else if (callback) {
          callback();
        }
      }
      
      type();
    }

    function showMessage(index, callback) {
      if (index >= messages.length) {
        if (callback) callback();
        return;
      }

      currentMessageIndex = index;
      typeText(speechBubble, messages[index], () => {
        speak(messages[index], () => {
          setTimeout(() => {
            showMessage(index + 1, callback);
          }, 800);
        });
      });
    }

    function startWelcomeSequence() {
      loadingText.textContent = 'جاري التحميل...';
      
      // Wait for robot to load
      const checkRobotLoaded = setInterval(() => {
        if (isRobotLoaded) {
          clearInterval(checkRobotLoaded);
          loadingText.textContent = '';
          
          // Start welcome sequence
          setTimeout(() => {
            showMessage(0, () => {
              continueBtn.classList.add('visible');
            });
          }, 500);
        }
      }, 100);
    }

    // Initial start
    startWelcomeSequence();

    // Continue button
    continueBtn.addEventListener('click', () => {
      synth.cancel();
      loadingOverlay.classList.add('fade-out');
      setTimeout(() => {
        window.location.href = 'index.html?openChat=true';
      }, 1000);
    });

    // Skip button
    skipBtn.addEventListener('click', () => {
      synth.cancel();
      loadingOverlay.classList.add('fade-out');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1000);
    });

    // Mute button
    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      if (isMuted) {
        synth.cancel();
        muteBtn.textContent = '🔇 كتم';
        muteBtn.classList.add('active');
      } else {
        muteBtn.textContent = '🔊 صوت';
        muteBtn.classList.remove('active');
        // Replay current message
        if (currentMessageIndex < messages.length) {
          speak(messages[currentMessageIndex]);
        }
      }
    });

    // Replay button
    replayBtn.addEventListener('click', () => {
      synth.cancel();
      continueBtn.classList.remove('visible');
      speechBubble.classList.remove('visible');
      speechBubble.textContent = '';
      
      setTimeout(() => {
        showMessage(0, () => {
          continueBtn.classList.add('visible');
        });
      }, 500);
    });

    // Audio interaction for mobile
    document.addEventListener('click', () => {
      if (synth.getVoices().length === 0) {
        loadVoices();
      }
    }, { once: true });
  </script>
</body>
</html>
