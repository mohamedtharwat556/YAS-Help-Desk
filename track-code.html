<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo.png">
  <title>كود التتبع — YAS Help Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 24px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: white;
    }
    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 10px;
    }
    p {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .code-box {
      background: #f5f5f5;
      border: 2px dashed #ddd;
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
    }
    .code-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
    }
    .code {
      font-size: 32px;
      font-weight: 800;
      color: #667eea;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .copy-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .copy-btn:hover {
      transform: scale(1.05);
    }
    .link {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
      margin-top: 20px;
      display: inline-block;
    }
    .link:hover {
      text-decoration: underline;
    }
    .ticket-info {
      background: #f9f9f9;
      border-radius: 12px;
      padding: 15px;
      margin-top: 20px;
      text-align: left;
    }
    .ticket-info div {
      margin-bottom: 8px;
      font-size: 13px;
      color: #555;
    }
    .ticket-info div:last-child {
      margin-bottom: 0;
    }
    .ticket-info strong {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">YAS</div>
    <h1>كود التتبع</h1>
    <p>استخدم هذا الكود لتتبع حالة طلبك في أي وقت</p>
    
    <div class="code-box">
      <div class="code-label">رقم التذكرة</div>
      <div class="code" id="ticket-code">YAS-SUP-XXXXX</div>
    </div>
    
    <button class="copy-btn" onclick="copyCode()">نسخ الكود</button>
    
    <a href="tracking.html" class="link">أو اذهب لصفحة التتبع</a>
    
    <div class="ticket-info" id="ticket-info" style="display:none">
      <div><strong>العميل:</strong> <span id="info-customer">—</span></div>
      <div><strong>الجهاز:</strong> <span id="info-device">—</span></div>
      <div><strong>التاريخ:</strong> <span id="info-date">—</span></div>
    </div>
  </div>

  <script>
    // Get ticket info from URL params
    const urlParams = new URLSearchParams(window.location.search);
    const ticketId = urlParams.get('id');
    const customer = urlParams.get('customer');
    const device = urlParams.get('device');
    const date = urlParams.get('date');

    if (ticketId) {
      document.getElementById('ticket-code').textContent = ticketId;
    }

    if (customer) {
      document.getElementById('info-customer').textContent = customer;
      document.getElementById('ticket-info').style.display = 'block';
    }

    if (device) {
      document.getElementById('info-device').textContent = device;
      document.getElementById('ticket-info').style.display = 'block';
    }

    if (date) {
      document.getElementById('info-date').textContent = new Date(date).toLocaleDateString('ar-EG');
      document.getElementById('ticket-info').style.display = 'block';
    }

    function copyCode() {
      const code = document.getElementById('ticket-code').textContent;
      navigator.clipboard.writeText(code).then(() => {
        alert('تم نسخ الكود بنجاح!');
      });
    }
  </script>
</body>
</html>
