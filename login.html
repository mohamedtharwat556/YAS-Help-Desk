<!DOCTYPE html>
<html lang="ar" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231A56DB%27/%3E%3Ctext x=%2716%27 y=%2722%27 text-anchor=%27middle%27 font-family=%27Inter%27 font-weight=%27800%27 font-size=%2712%27 fill=%27white%27%3EYAS%3C/text%3E%3C/svg%3E">
  <title>تسجيل الدخول — YAS Help Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="login-page">
  <div class="login-card page-enter">

    <!-- Logo -->
    <div class="login-logo">
      <div class="logo-mark-lg">YAS</div>
      <h2>YAS Help Desk</h2>
      <p>Technical Support &amp; Customer Service</p>
    </div>

    <!-- Demo Note -->
    <div class="login-demo-note">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <div>
        <strong>بيانات الدخول التجريبية:</strong><br>
        البريد: <span style="font-family:var(--font-ui);direction:ltr;display:inline-block">adam@yas.sa</span><br>
        كلمة المرور: <span style="font-family:var(--font-ui)">adam2024</span><br>
        <button id="demo-fill" style="background:none;border:none;color:#92400E;font-size:0.8125rem;font-weight:700;cursor:pointer;padding:4px 0;font-family:var(--font-arabic);text-decoration:underline">تعبئة تلقائية</button>
      </div>
    </div>

    <!-- Form -->
    <form id="login-form" novalidate>

      <div class="form-group">
        <label for="login-email">البريد الإلكتروني</label>
        <div style="position:relative">
          <input
            type="email"
            id="login-email"
            placeholder="adam@yas.sa"
            autocomplete="email"
            dir="ltr"
            style="padding-right:40px;text-align:center"
          >
          <span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="login-password">كلمة المرور</label>
        <div style="position:relative">
          <input
            type="password"
            id="login-password"
            placeholder="••••••••"
            autocomplete="current-password"
            dir="ltr"
            style="padding-right:40px;padding-left:40px;text-align:center"
          >
          <span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <button
            type="button"
            id="toggle-password"
            style="position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;display:flex;align-items:center"
            aria-label="إظهار/إخفاء كلمة المرور"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <!-- Error -->
      <div id="login-error" style="display:none;background:var(--danger-light);border:1px solid #FECACA;border-radius:var(--radius);padding:10px 14px;font-size:0.875rem;color:var(--danger);margin-bottom:var(--space-4);align-items:center;gap:8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span></span>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-submit" style="margin-top:var(--space-2)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        تسجيل الدخول
      </button>

    </form>

    <!-- Footer -->
    <div style="margin-top:var(--space-6);text-align:center;border-top:1px solid var(--border);padding-top:var(--space-5)">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-4)">
        <a href="index.html" style="font-size:0.875rem;color:var(--text-muted);display:flex;align-items:center;gap:6px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          بوابة العملاء
        </a>
        <button class="theme-toggle" id="theme-toggle-btn" style="border:1px solid var(--border)" aria-label="تبديل الوضع"></button>
      </div>
    </div>

    <div style="text-align:center;margin-top:var(--space-4);font-size:0.75rem;color:var(--text-disabled)">
      هذا النظام مخصص لفريق YAS الداخلي فقط
    </div>

  </div>
</div>

<div id="toast-container"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
